[package]
name = "kyrax"
version = "1.0.7"
description = "kyrax: a fast Excel engine"
authors = ["Aditya Vishwakarma <aditya.vishwakarma@vertexconsulting.in>"]
rust-version = "1.85.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AdityaVishwakarmaIN/kyrax"
homepage = "https://github.com/AdityaVishwakarmaIN/kyrax"
documentation = "https://github.com/AdityaVishwakarmaIN/kyrax"
include = [
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/Makefile",
    "/src",
    "/python/kyrax",
    "!__pycache__",
    "!*.pyc",
    "!*.so",
    "!*.pyd",
    "!*.pdb",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "kyrax"
crate-type = ["cdylib", "rlib"]

# Stage -1 direct-evaluator classification harness. Cargo only auto-discovers
# integration tests under `tests/`; `tests_formulas/` is this repo's formula-
# validation test area, so its harness needs an explicit target.
[[test]]
name = "direct_eval"
path = "tests_formulas/direct_eval.rs"

# Lane H: array-result hydration/spill persistence (see
# formula-validation/round2/brief_lane_H.csv). Same explicit-target rationale.
[[test]]
name = "lane_h"
path = "tests_formulas/lane_h.rs"

[dependencies]
arrow-array = { version = "^59", features = ["ffi"], optional = true }
arrow-pyarrow = { version = "^59", optional = true }
arrow-schema = { version = "^59", optional = true }
calamine = { version = "^0.35.0", features = ["chrono"] }
chrono = { version = "^0.4.40", default-features = false }
log = "^0.4"
polars-core = { version = ">=0.53", features = [
    "dtype-date",
    "dtype-datetime",
    "dtype-duration",
], optional = true }
pyo3 = { version = "^0.28", features = ["abi3-py310"], optional = true }
pyo3-arrow = { version = "^0.18", default-features = false, optional = true }
pyo3-log = { version = "^0.13.3", optional = true }
# turbo fast-path (src/turbo/)
libdeflater = "1.24"
# Streaming READ path (src/turbo/stream.rs). The zip crate is already compiled
# into every build as calamine's dependency; promoting it to a direct dep
# (same version, same feature set calamine uses) is how we get a bounded-memory
# streaming inflate. libdeflate cannot stream: its `_ex` entry point does not
# report input consumed on partial output and does not persist the bitstream,
# so it cannot resume after an output window fills. We keep libdeflate for the
# eager path (unchanged) and use `zip`'s streaming ZipFile reader for the new
# streaming path.
zip = { version = "7.0", default-features = false, features = ["deflate"] }
# Streaming inflate for the bounded-memory read path (see src/turbo/stream.rs
# for why libdeflate cannot stream). Already compiled into every build as
# zip→flate2's inflater; promoted to a direct dep unchanged.
miniz_oxide = "0.8"
memchr = "2.7"
rayon = "1.10"
fast-float2 = "0.2"
# turbo write path (src/turbo/write/)
itoa = "1.0"
ryu = "1.0"
ahash = "0.8"
# ECMA-376 encrypted-workbook key derivation (src/turbo/crypto/) — optional.
# Only these RustCrypto crates are permitted for the encryption feature.
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }

# Windows heap fragmentation on repeated large write alloc/free cycles.
# Windows-only: avoids breaking the Linux aarch64 manylinux2014 cross-build,
# where mimalloc's bundled C sources fail under the image's ancient GCC.
[target.'cfg(windows)'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
anyhow = "1.0.102"
pretty_assertions = { version = "^1.4.1", features = ["unstable"] }
rstest = { version = "^0.26.1", default-features = false }
# The bounded-memory measurement (tests/streaming_memory.rs) installs its own
# counting global allocator. A binary may only have ONE global allocator, and
# the lib declares mimalloc on Windows, so that test builds the lib with
# `count_alloc` to gate the mimalloc declaration off and install its own.
kyrax = { path = ".", default-features = false, features = ["count_alloc", "__arrow"] }

# NOTE: This is a hack to bypass pyo3 limitations when testing:
# https://pyo3.rs/v0.22.3/faq.html#i-cant-run-cargo-test-or-i-cant-build-in-a-cargo-workspace-im-having-linker-issues-like-symbol-not-found-or-undefined-reference-to-_pyexc_systemerror
[features]
default = []
__arrow = ["dep:arrow-schema", "dep:arrow-array"]
python = ["__arrow", "dep:pyo3", "dep:pyo3-log", "dep:pyo3-arrow"]
extension-module = ["pyo3/extension-module"]
polars = ["dep:polars-core"]
pyarrow = ["dep:arrow-pyarrow", "python"]
# ECMA-376 encrypted-workbook support (src/turbo/crypto/keys.rs). Off by default
# so the base build's dependency surface is unchanged.
encryption = ["dep:aes", "dep:cbc", "dep:sha2", "dep:hmac"]
# Private features for internal usage, should not be used directly as they may
# change without notice
__pyo3-tests = [
    # feature for tests only. This makes Python::with_gil auto-initialize Python
    # interpreters, which allows us to instantiate Python objects in tests
    # (see https://pyo3.rs/v0.22.3/features#auto-initialize)
    "pyo3/auto-initialize",
    "pyarrow",
]
__rust-tests-standalone = ["__arrow"]
__rust-tests-polars = ["polars"]
# Private feature: used by tests/streaming_memory.rs to install a counting
# global allocator (gates the Windows-only mimalloc `#[global_allocator]` off
# so the measurement binary can declare its own).
count_alloc = []
# Private feature for maturin usage, should not be used directly
__maturin = ["extension-module", "pyarrow"]
