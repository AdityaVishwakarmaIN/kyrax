version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    rust: "latest"
  commands:
    - pip install --upgrade uv
    - uv sync --frozen --group docs
    - uv run maturin develop --uv
    - mkdir -p _readthedocs/html
    - uv run pdoc --template-directory doc-templates -o _readthedocs/html python/kyrax
